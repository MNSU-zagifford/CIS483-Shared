<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Builder Team Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        p {
            text-align: center;
            font-size: 1.1em;
            color: #555;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            background-color: #ffffff;
            margin: 10px 0;
            padding: 12px 18px;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            font-size: 1.05em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        li:hover {
            background-color: #e8f4fd;
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <h1>Builder</h1>
    <p>We are a team in CIS 483/583, Fall 2026.</p>
    <ul>
        <li>Pratik Niroula</li>
        <li>Yeabsra Tetemke</li>
        <li>Zachary Gifford</li>
        <li>Kirubel Dula</li>
    </ul>
</body>
</html>
