<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 4 — Form Validation</title>
</head>
<body>
  <h1>Student Grade Form Validation</h1>
  
  <form id="gradeForm">
    <div>
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName">
    </div>
    <br>

    <div>
      <label for="studentEmail">Email (Challenge):</label>
      <input type="text" id="studentEmail">
    </div>
    <br>

    <div>
      <label for="studentScore">Score (0 - 100):</label>
      <input type="text" id="studentScore">
    </div>
    <br>

    <button type="submit">Submit Grade</button>
  </form>

  <div id="messageArea" style="margin-top: 20px;"></div>

  <script src="script.js"></script>
</body>
</html>
